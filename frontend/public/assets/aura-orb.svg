<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Soft ambient bloom filter -->
    <filter id="aura-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Inner fluid dispersion blur -->
    <filter id="fluid-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5" />
    </filter>

    <!-- Base 3D Sphere Radial Gradient -->
    <radialGradient id="sphere-base" cx="36%" cy="30%" r="68%" fx="32%" fy="26%">
      <stop offset="0%" stop-color="#CBEBFF" />
      <stop offset="20%" stop-color="#38BDF8" />
      <stop offset="48%" stop-color="#2563EB" />
      <stop offset="78%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </radialGradient>

    <!-- Swirling Fluid Nebula Gradient (Cyan / Electric Blue) -->
    <linearGradient id="swirl-cyan" x1="15%" y1="85%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0" />
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#E0F2FE" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Swirling Fluid Nebula Gradient (Violet / Deep Indigo) -->
    <linearGradient id="swirl-violet" x1="85%" y1="85%" x2="15%" y2="20%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#6366F1" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Specular Gloss Highlight -->
    <linearGradient id="specular-gloss" x1="30%" y1="10%" x2="50%" y2="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Rim Light Gradient -->
    <radialGradient id="rim-light" cx="65%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Orbital Ring Gradient -->
    <linearGradient id="ring-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- 1. Ambient Outer Halo Rings (Soft Luminous Aura Waves) -->
  <circle cx="100" cy="100" r="92" stroke="url(#ring-gradient)" stroke-width="1.5" opacity="0.65" />
  <circle cx="100" cy="100" r="84" stroke="#60A5FA" stroke-width="1" opacity="0.35" />

  <!-- 2. Main 3D Glass Sphere Body with Specular Depth -->
  <g filter="url(#aura-glow)">
    <!-- Base 3D Sphere -->
    <circle cx="100" cy="100" r="74" fill="url(#sphere-base)" />

    <!-- Deep Violet / Magenta Fluid Shade -->
    <circle cx="105" cy="105" r="68" fill="url(#swirl-violet)" />

    <!-- Dynamic Liquid Swirl 1 -->
    <path d="M52,108 C46,74 80,48 116,54 C146,59 162,84 156,114 C148,138 122,156 94,148 C66,140 56,124 52,108 Z" 
          fill="url(#swirl-cyan)" filter="url(#fluid-blur)" />
    
    <!-- Dynamic Liquid Swirl Arc 2 -->
    <path d="M72,80 C94,60 134,68 144,94 C150,116 134,140 110,144 C88,148 68,132 70,112 C72,96 84,84 100,84" 
          fill="none" stroke="#E0F2FE" stroke-width="5" stroke-linecap="round" filter="url(#fluid-blur)" opacity="0.8" />

    <!-- Reflected Bottom-Right Rim Light -->
    <circle cx="100" cy="100" r="73" fill="url(#rim-light)" />

    <!-- Specular Gloss Highlight (Upper-Left Reflection) -->
    <ellipse cx="82" cy="62" rx="26" ry="14" transform="rotate(-30 82 62)" fill="url(#specular-gloss)" />
    
    <!-- High-intensity Specular Sparkle -->
    <circle cx="72" cy="54" r="4.5" fill="#FFFFFF" opacity="0.95" />
    <circle cx="64" cy="64" r="2" fill="#FFFFFF" opacity="0.75" />
  </g>
</svg>