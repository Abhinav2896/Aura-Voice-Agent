<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Left Leg Gradient: Cyan to Royal Blue -->
    <linearGradient id="left-leg" x1="20%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Right Leg Gradient: Royal Blue to Violet -->
    <linearGradient id="right-leg" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Subtle Apex Ribbon Fold Overlay -->
    <linearGradient id="apex-fold" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Right Leg (Underneath) -->
  <line x1="50" y1="18" x2="77" y2="76" stroke="url(#right-leg)" stroke-width="19" stroke-linecap="round" />

  <!-- Left Leg (Overlapping Front) -->
  <line x1="23" y1="76" x2="50" y2="18" stroke="url(#left-leg)" stroke-width="19" stroke-linecap="round" />

  <!-- Apex translucent intersection fold -->
  <circle cx="50" cy="18" r="9.5" fill="url(#apex-fold)" />
</svg>
